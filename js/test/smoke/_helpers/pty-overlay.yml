# Config for the PTY-overlay smoke (js/test/smoke/pty-overlay.js).
# A bootable 2-column layout with a detail pane. The smoke opens a `terminal` PANE
# via `:terminal <cmd>` (U2d) whose command echoes a unique marker then sleeps
# (keeps the session alive so the marker stays in the buffer). Minting the pane
# makes the dispatch finalizer spawn the PTY and render paint its buffer — the
# v0.6.5 §5 "render is read-only for the overlay" arc, now exercised through the
# terminal-pane path. Minimal + self-contained: no docker / postgres.
project_dir: ../../..

groups:
  term:
    label: PTY smoke
    containers: []
    actions:
      noop:
        label: noop
        desc: A no-op action so the group is valid; never run by the smoke.
        type: run
        script: 'true'
        tab: false

panels:
  files:
    type: files
    title: Files
  detail:
    type: detail
    title: Detail

layout:
  columns:
    - width: 30
      panels:
        - files
    - panels:
        - detail
