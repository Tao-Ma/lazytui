# lazytui demo — host-monitor (a btop-style system monitor).
#
# The first demo with NO container at all: it monitors the HOST. Live CPU,
# memory, and network graphs (+ per-core / disk / per-iface bars) come entirely
# from the top-level `metrics:` block — each entry polls a plain host command,
# extracts numbers from stdout, and publishes them to a hub topic that a `stats`
# graph or `gauge` bar renders — stacked into btop-style `composite` boxes. No
# docker, no framework code: the whole data path is declared here in YAML.
#
# This is what the metrics-producer feature (docs/metrics-producer.md) unlocks —
# the same braille line-graphs that used to be docker-only, now over `/proc`,
# `free`, and friends. See `.agent-prompt.md` for the intent and the two-step
# loop this demo documents.
#
# Run:
#   cd demo/host-monitor && ./run
#   node js/app/tui.js demo/host-monitor/tui.yml     # equivalent, from repo root
#
# Requires: Linux (reads /proc/stat, /proc/loadavg, /proc/net/dev, /proc/diskstats), `free`,
# `df`, `ps`, `awk`. `mpstat` (sysstat) for the per-core bars — OPTIONAL (that one
# producer just reads "(no data yet)" without it). `top` for the live process tab.

project_dir: ../..
theme: monokai

# --- Headless metric producers -------------------------------------------------
# Each polls a command every `interval` ms and publishes parsed numbers to its
# topic. All commands are cwd-independent one-liners (no script files needed).
metrics:
  # Overall CPU busy% — two /proc/stat aggregate samples 0.2s apart, busy =
  # 100 - idle over the delta. POSIX sh; the shell expands $t1/$t2 into awk.
  host.cpu:
    cmd: |-
      read c u n s i io r sr st rest </proc/stat; t1=$((u+n+s+i+io+r+sr+st)); i1=$((i+io)); sleep 0.2; read c u n s i io r sr st rest </proc/stat; t2=$((u+n+s+i+io+r+sr+st)); i2=$((i+io)); awk "BEGIN{d=$t2-$t1;di=$i2-$i1;if(d>0)printf \"%.1f\",100*(d-di)/d;else print 0}"
    interval: 2000
    extract:
      mode: regex
      fields: { cpu: '([0-9.]+)' }
    schema:
      columns: { cpu: { type: percent, unit: '%' } }

  # Per-core busy% — one row per core, for the CPU box's per-core BAR strip (btop's
  # signature). `mpstat -P ALL` prints a line per core; the awk skips the "all"
  # aggregate row ($2 is a core number, not "all") and emits busy = 100 - %idle
  # ($NF). Needs `mpstat` (sysstat) — OPTIONAL: without it the poll fails and the
  # per-core bars just read "(no data yet)"; every other panel is unaffected.
  host.core:
    cmd: "mpstat -P ALL 1 1 | awk '/^[0-9]/ && $2 ~ /^[0-9]+$/ {print $2, 100-$NF}'"
    interval: 2000
    extract:
      mode: columns
      row_key: core
      fields: { core: 0, busy: 1 }
    schema:
      row_key: core
      columns: { busy: { type: percent, unit: '%' } }

  # Load average (1/5/15 min) from /proc/loadavg — btop's CPU-box load line. A
  # single stream (no row_key); the CPU box graphs the 1-min `load`, and 5m/15m
  # ride along in the schema for context. `type: number` (load isn't a percent —
  # it can exceed 1.0; the graph auto-scales to the local max).
  host.load:
    cmd: "cat /proc/loadavg"
    interval: 2000
    extract:
      mode: columns
      fields: { load: 0, load5: 1, load15: 2 }
    schema:
      columns:
        load:   { type: number }
        load5:  { type: number }
        load15: { type: number }

  # Memory + swap used% — from `free`: RAM used/total, and swap used/total (0 when
  # the host has no swap). btop's mem box stacks RAM over SWAP; the graph plots both
  # as two sections. `columns` mode reads the two awk-printed numbers positionally.
  host.mem:
    cmd: "free | awk '/^Mem:/{m=$3/$2*100} /^Swap:/{s=($2>0)?$3/$2*100:0} END{printf \"%.1f %.1f\", m, s}'"
    interval: 2000
    extract:
      mode: columns
      fields: { mem: 0, swap: 1 }
    schema:
      columns:
        mem:  { type: percent, unit: '%' }
        swap: { type: percent, unit: '%' }

  # Top processes by CPU — a multi-row topic (one row per pid). The TABLE and the
  # CPU-bars GAUGE show a few columns (cpu/mem/comm); the extra columns (state,
  # threads, rss, ppid, user, full command line) are carried so that SELECTING a
  # process shows them all as a detail card in the Output pane's Info tab (btop's
  # process popup — the `getInfo` row projection, docs/metrics-producer.md §9).
  #
  # `args` (the full command line) has embedded spaces, so the whitespace column
  # extractor can't take it as one field — the awk re-emits each row TAB-delimited
  # (fixed single-token columns, then `args` joined as the trailing field) and
  # converts `rss` from ps's KiB to bytes for the `bytes` formatter.
  host.proc:
    cmd: |-
      ps -eo pid=,pcpu=,pmem=,stat=,nlwp=,rss=,ppid=,user=,comm=,args= --sort=-pcpu | head -20 | awk '{c="";for(i=10;i<=NF;i++)c=c (i>10?" ":"") $i; printf "%s\t%s\t%s\t%s\t%s\t%d\t%s\t%s\t%s\t%s\n",$1,$2,$3,$4,$5,$6*1024,$7,$8,$9,c}'
    interval: 3000
    extract:
      mode: columns
      delimiter: tab
      row_key: pid
      fields: { pid: 0, cpu: 1, mem: 2, state: 3, threads: 4, rss: 5, ppid: 6, user: 7, comm: 8, command: 9 }
    # Column ORDER here is the DETAIL CARD's order (rowInfo walks schema columns).
    # Lead with what identifies the process at a glance — the full command, then
    # cpu/mem/rss — so the useful fields sit above the fold in a short pane; the
    # rarer ones (threads/ppid/user) trail. The table's own `columns:` list is
    # independent of this order.
    schema:
      row_key: pid
      columns:
        command: { type: string }
        cpu: { type: percent }
        mem: { type: percent }
        rss: { type: bytes }
        state: { type: string }
        threads: { type: number }
        ppid: { type: number }
        user: { type: string }
        comm: { type: string }

  # Network throughput — /proc/net/dev gives MONOTONIC byte counters per
  # interface (rx = col 1, tx = col 9, after stripping the `iface:` colon and the
  # 2 header lines). `type: counter` tells the producer to publish the per-second
  # RATE (bytes/s) instead of the raw tally — the table then shows live B/s.
  host.net:
    cmd: "cat /proc/net/dev | tail -n +3 | tr -d ':'"
    interval: 2000
    extract:
      mode: columns
      row_key: iface
      fields: { iface: 0, rx: 1, tx: 9 }
    schema:
      row_key: iface
      columns: { rx: { type: counter }, tx: { type: counter } }

  # Disk USAGE — `df` per mount (real filesystems only; pseudo FS excluded). The
  # awk drops the `%` from the capacity column and converts df's KiB blocks to
  # bytes. One row per mount point: `pct` (used %) drives the gauge, `used`/`size`
  # (bytes) show in the detail card. Polled slowly — usage barely moves.
  host.disk:
    cmd: |-
      df -Pk -x tmpfs -x devtmpfs -x overlay -x squashfs | awk 'NR>1{gsub(/%/,"",$5); printf "%s\t%s\t%d\t%d\n",$6,$5,$3*1024,$2*1024}'
    interval: 5000
    extract:
      mode: columns
      delimiter: tab
      row_key: mount
      fields: { mount: 0, pct: 1, used: 2, size: 3 }
    schema:
      row_key: mount
      columns:
        pct: { type: percent }
        used: { type: bytes }
        size: { type: bytes }


# --- Panels --------------------------------------------------------------------
# btop-density COMPOSITE boxes (docs/compact-panes.md): each `type: composite`
# stacks several border-less widget bodies — `graph` (stats line graph, incl.
# `overlay: true` for rx/tx in one grid), `bars` (gauge meter bars, one of which may
# be `interactive: true` for a cursor inside the box), and `meter` (a single-value
# gauge) — in ONE bordered pane, so the CPU / Memory / Network dashboards read like
# btop's boxes instead of one pane per metric. `widgets[].height: N%` anchors a
# widget's share of the box; the rest flex. Hover the mouse over any standalone
# `stats` graph (e.g. the Selected drill-down) to read the value under the cursor.
panels:
  actions:
    type: actions
    title: Host
  # CPU box — the aggregate busy% trend graph (its own % meter) + a 1-min LOAD graph
  # (btop's load line) above a per-core BAR strip (host.core, one bar per core).
  # btop's CPU box in one pane. (Cores needs `mpstat`; without it the strip reads
  # "(no data yet)" — every other box is unaffected.)
  cpu_box:
    type: composite
    title: CPU
    widgets:
      - { type: graph, topic: host.cpu,  row: _, metrics: [cpu],  height: 40% }
      - { type: graph, topic: host.load, row: _, metrics: [load], height: 30% }
      - { type: bars,  topic: host.core, column: busy, heading: Cores }
  # Memory box — RAM used% + SWAP used% as two stacked graph sections (each with its
  # own % meter), then a `meter` HEADLINE for the fullest disk (one bar for the single
  # most-used mount — the `meter` kind is a single-value gauge; it takes the top-sorted
  # row), above the disk-USAGE bar per mount. The disk-usage strip is `interactive:
  # true`: focus the box (click it / its hotkey) and j/k or click picks a mount, whose
  # detail card shows in the Output pane's Info tab. At most one interactive widget/box.
  mem_box:
    type: composite
    title: Memory
    widgets:
      - { type: graph, topic: host.mem,  row: _, metrics: [mem, swap], height: 55% }
      - { type: meter, topic: host.disk, column: pct, heading: Fullest disk }
      - { type: bars,  topic: host.disk, column: pct, heading: Disk usage, interactive: true }
  # Network box — btop's mirrored up/down shape for ONE selected interface, with a
  # `‹ eth0 ›` cycler in the top border to switch interfaces (click ‹/›, or j/k when
  # the box is focused). The per-iface rx bars below are `interactive: true` — they
  # carry the box's cursor (the selected iface highlights), and the two mirror graphs
  # `select_from: net_box` (this composite's own cursor) so they plot whichever
  # interface is selected. TX (upload) rises from the top; RX (download) HANGS via
  # `invert: true` with its label moved below (`header: bottom`) and the gap removed
  # (`flush: true`), so the baselines meet at a tight centre seam.
  net_box:
    type: composite
    title: Network
    widgets:
      # `window: 180` (~6 min at the 2s net poll) fills the graph width instead of a
      # right-edge stub — same fix as procsel's window:120 (net_box shares col 2, so
      # the same inner width), scaled for net's faster 2s poll to match that ~6-min depth.
      - { type: graph, topic: host.net, select_from: net_box, metrics: [tx], window: 180, height: 31% }                               # ↑ rises, label on top
      - { type: graph, topic: host.net, select_from: net_box, metrics: [rx], window: 180, invert: true, header: bottom, flush: true, height: 31% }  # ↓ hangs, label below, seam flush
      - { type: bars,  topic: host.net, column: rx, heading: Iface rx/s, interactive: true }                             # the iface cursor (‹ eth0 › + j/k)
  # The process TABLE — host.proc rows, sorted by CPU, SELECTABLE + KILLABLE. The
  # detailed columnar list: focus it and the Output pane's Info tab shows the selected
  # process's full column set; `K` opens the signal picker. (The compact CPU-trend
  # overview is the pane that drives the Selected drill-down; this is the actions list.)
  procs:
    type: table
    title: Processes
    topic: host.proc
    columns: [cpu, mem, comm]   # schema columns to show; pid is the row identity
    sort: cpu                    # default sort (desc for a metric); siblings honour it in tree mode
    killable: true               # rows are pids → K / bottom-bar chip opens a signal picker
    tree: { parent: ppid }       # hierarchical (ppid) — opens as a tree; `t` flat, `z` fold
  # Compact per-process CPU OVERVIEW — one braille sparkline per process (host.proc,
  # `mode: multi`), sorted by CPU, and SELECTABLE (focus it, then j/k or click a row).
  # The selected process drives the `Selected` drill-down below (`select_from`) and its
  # detail card shows in the Output pane's Info tab. This is btop's "pick a process by
  # its trend at a glance" surface; the Processes TABLE (col 3) is the detailed, killable
  # list. `label: comm` names each row by command; `window: 60` (~3 min at the 3s poll).
  proctrend:
    type: stats
    title: CPU trend
    topic: host.proc
    mode: multi
    column: cpu
    label: comm
    window: 60
  # Drill-down: the SELECTED process's recent HISTORY — CPU%, MEM%, and RSS
  # (absolute memory footprint) as three stacked graphs, each with peak/avg. Follows
  # the CPU-trend overview's cursor (`select_from: proctrend`) — pick a process in the
  # sparkline list above and it inspects here; the full current-value column set lives
  # in the Info card. `window: 120` (~6 min at the 3s poll) fills the graph width.
  procsel:
    type: stats
    title: Selected
    topic: host.proc
    select_from: proctrend
    window: 120
    metrics: [cpu, mem, rss]
  # The Output pane. Its Info tab is the process DETAIL CARD: focus the process
  # table and it shows the selected process's full column set — state, threads,
  # RSS, parent pid, user, command line. Host-action output (ps/uptime) lands in
  # its Transcript tab.
  detail:
    type: detail
    title: Output

layout:
  # Three concern-grouped columns (btop-style). Column widths use FLEX so slack on
  # a wide terminal spreads instead of ballooning one column: col 1 is a FIXED-narrow
  # stack (the CPU + Memory composites read fine at 34 cols); cols 2 & 3 are
  # `width: flex`, so they SHARE the leftover equally (e.g. 200 cols → 34 / 83 / 83,
  # not 34 / 46 / 120). The last column ALWAYS flexes (its width is the remainder);
  # marking col 2 flex too is what balances them.
  #
  # Content follows the width: the elastic last column holds the width-HUNGRY,
  # always-populated PROCESS TABLE (long command lines use the room) above actions +
  # Output — so the widest column is the busiest, not a mostly-empty drill-down.
  # `select_from` resolves the SPECIFIC named pane (B-F3), so procsel follows proctrend
  # cross-pane. `actions` must sit in the LAST column (framework rule). A single-
  # tab slot (`{tabs:[x]}`) renders no strip; a metrics pane in a MULTI-tab slot
  # would show invisible tabs, so each stays in its own slot.
  columns:
    # Col 1 — FIXED narrow: the CPU + Memory composite boxes (each graph + a bar
    # strip). Two per column so each box gets the vertical room its graph needs — a
    # third pane here would cramp them (and trip the soft cap on small terminals).
    - width: 34
      panels:
        - cpu_box                       # composite: cpu graph + per-core bars
        - mem_box                       # composite: mem graph + disk-usage bars
    # Col 2 — FLEX: the Network composite + the SELECTABLE CPU-trend overview + the
    # drill-down it drives. Overview sits directly above its drill (pick a process
    # above → inspect it below). Shares the leftover width with col 3.
    - width: flex
      panels:
        - { tabs: [net_box],  heightPct: 36 }  # composite: net up/down mirror graph + per-iface bars (needs the room)
        - { tabs: [proctrend], heightPct: 20 } # mode:multi CPU sparklines — SELECTABLE (j/k/click) → drives procsel
        - { tabs: [procsel],  heightPct: 44 }  # selected-proc drill-down: cpu/mem/rss history (3 graphs need room)
    # Col 3 — FLEX (implicit-last): the elastic column's star is the PROCESS TABLE,
    # which always has rows and whose command column expands to use the width.
    - panels:
        - procs                                # detailed process table (Info card + K kill)
        - { tabs: [actions], heightPct: 16 }   # host actions (compact)
        - { tabs: [detail], heightPct: 34 }    # Output (detail card / action transcript)

# --- Host actions --------------------------------------------------------------
groups:
  host:
    label: Host
    containers: []
    actions:
      top:
        label: top (live)
        desc: Live process view in an embedded terminal tab. Quit with `q`.
        type: spawn
        cmd: top
      ps:
        label: processes (snapshot)
        desc: Top 25 processes by CPU, one-shot into the Output panel.
        type: run
        cmd: ps -eo pid,pcpu,pmem,comm --sort=-pcpu | head -25
      uptime:
        label: uptime
        desc: System uptime + load averages.
        type: run
        cmd: uptime
