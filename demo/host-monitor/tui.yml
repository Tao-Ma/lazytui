# lazytui demo — host-monitor (a btop-style system monitor).
#
# The first demo with NO container at all: it monitors the HOST. Live CPU,
# memory, and load graphs come entirely from the top-level `metrics:` block —
# each entry polls a plain host command, extracts a number from stdout, and
# publishes it to a hub topic that a `stats` panel graphs. No docker, no
# framework code: the whole data path is declared here in YAML.
#
# This is what the metrics-producer feature (docs/metrics-producer.md) unlocks —
# the same braille line-graphs that used to be docker-only, now over `/proc`,
# `free`, and friends. See `.agent-prompt.md` for the intent and the two-step
# loop this demo documents.
#
# Run:
#   cd demo/host-monitor && ./run
#   node js/app/tui.js demo/host-monitor/tui.yml     # equivalent, from repo root
#
# Requires: Linux (reads /proc/stat, /proc/loadavg), `free`, `awk`. `top` for
# the live process tab.

project_dir: ../..
theme: monokai

# --- Headless metric producers -------------------------------------------------
# Each polls a command every `interval` ms and publishes parsed numbers to its
# topic. All commands are cwd-independent one-liners (no script files needed).
metrics:
  # Overall CPU busy% — two /proc/stat aggregate samples 0.2s apart, busy =
  # 100 - idle over the delta. POSIX sh; the shell expands $t1/$t2 into awk.
  host.cpu:
    cmd: |-
      read c u n s i io r sr st rest </proc/stat; t1=$((u+n+s+i+io+r+sr+st)); i1=$((i+io)); sleep 0.2; read c u n s i io r sr st rest </proc/stat; t2=$((u+n+s+i+io+r+sr+st)); i2=$((i+io)); awk "BEGIN{d=$t2-$t1;di=$i2-$i1;if(d>0)printf \"%.1f\",100*(d-di)/d;else print 0}"
    interval: 2000
    extract:
      mode: regex
      fields: { cpu: '([0-9.]+)' }
    schema:
      columns: { cpu: { type: percent, unit: '%' } }

  # Memory used% — from `free` (used / total * 100).
  host.mem:
    cmd: "free | awk '/^Mem/{printf \"%.1f\", $3/$2*100}'"
    interval: 2000
    extract:
      mode: regex
      fields: { mem: '([0-9.]+)' }
    schema:
      columns: { mem: { type: percent, unit: '%' } }

  # 1-minute load average.
  host.load:
    cmd: "awk '{print $1}' /proc/loadavg"
    interval: 2000
    extract:
      mode: regex
      fields: { load: '([0-9.]+)' }
    schema:
      columns: { load: { type: number } }

  # Top processes by CPU — a multi-row topic (one row per pid). The TABLE and the
  # CPU-bars GAUGE show a few columns (cpu/mem/comm); the extra columns (state,
  # threads, rss, ppid, user, full command line) are carried so that SELECTING a
  # process shows them all as a detail card in the Output pane's Info tab (btop's
  # process popup — the `getInfo` row projection, docs/metrics-producer.md §9).
  #
  # `args` (the full command line) has embedded spaces, so the whitespace column
  # extractor can't take it as one field — the awk re-emits each row TAB-delimited
  # (fixed single-token columns, then `args` joined as the trailing field) and
  # converts `rss` from ps's KiB to bytes for the `bytes` formatter.
  host.proc:
    cmd: |-
      ps -eo pid=,pcpu=,pmem=,stat=,nlwp=,rss=,ppid=,user=,comm=,args= --sort=-pcpu | head -20 | awk '{c="";for(i=10;i<=NF;i++)c=c (i>10?" ":"") $i; printf "%s\t%s\t%s\t%s\t%s\t%d\t%s\t%s\t%s\t%s\n",$1,$2,$3,$4,$5,$6*1024,$7,$8,$9,c}'
    interval: 3000
    extract:
      mode: columns
      delimiter: tab
      row_key: pid
      fields: { pid: 0, cpu: 1, mem: 2, state: 3, threads: 4, rss: 5, ppid: 6, user: 7, comm: 8, command: 9 }
    # Column ORDER here is the DETAIL CARD's order (rowInfo walks schema columns).
    # Lead with what identifies the process at a glance — the full command, then
    # cpu/mem/rss — so the useful fields sit above the fold in a short pane; the
    # rarer ones (threads/ppid/user) trail. The table's own `columns:` list is
    # independent of this order.
    schema:
      row_key: pid
      columns:
        command: { type: string }
        cpu: { type: percent }
        mem: { type: percent }
        rss: { type: bytes }
        state: { type: string }
        threads: { type: number }
        ppid: { type: number }
        user: { type: string }
        comm: { type: string }

  # Network throughput — /proc/net/dev gives MONOTONIC byte counters per
  # interface (rx = col 1, tx = col 9, after stripping the `iface:` colon and the
  # 2 header lines). `type: counter` tells the producer to publish the per-second
  # RATE (bytes/s) instead of the raw tally — the table then shows live B/s.
  host.net:
    cmd: "cat /proc/net/dev | tail -n +3 | tr -d ':'"
    interval: 2000
    extract:
      mode: columns
      row_key: iface
      fields: { iface: 0, rx: 1, tx: 9 }
    schema:
      row_key: iface
      columns: { rx: { type: counter }, tx: { type: counter } }

  # Total network throughput — the SAME /proc/net/dev counters summed across all
  # real interfaces (skip `lo`) into a SINGLE stream, so a `stats` graph can plot
  # it with `row: _` (btop's up/down trend). This is a single-stream sibling of
  # host.net, deliberately NOT a `select_from` of the net table: select_from
  # resolves its target to the kind-PRIMARY table (a known limitation), and the
  # net table is not the primary here — so an aggregate stream is both correct
  # and more btop-faithful (total up/down, not one selected iface).
  host.nettotal:
    cmd: "cat /proc/net/dev | tail -n +3 | tr -d ':' | awk '$1!=\"lo\"{r+=$2;t+=$10} END{printf \"%d %d\\n\",r,t}'"
    interval: 2000
    extract:
      mode: columns
      fields: { rx: 0, tx: 1 }
    schema:
      columns: { rx: { type: counter }, tx: { type: counter } }

  # Disk USAGE — `df` per mount (real filesystems only; pseudo FS excluded). The
  # awk drops the `%` from the capacity column and converts df's KiB blocks to
  # bytes. One row per mount point: `pct` (used %) drives the gauge, `used`/`size`
  # (bytes) show in the detail card. Polled slowly — usage barely moves.
  host.disk:
    cmd: |-
      df -Pk -x tmpfs -x devtmpfs -x overlay -x squashfs | awk 'NR>1{gsub(/%/,"",$5); printf "%s\t%s\t%d\t%d\n",$6,$5,$3*1024,$2*1024}'
    interval: 5000
    extract:
      mode: columns
      delimiter: tab
      row_key: mount
      fields: { mount: 0, pct: 1, used: 2, size: 3 }
    schema:
      row_key: mount
      columns:
        pct: { type: percent }
        used: { type: bytes }
        size: { type: bytes }

  # Disk THROUGHPUT — /proc/diskstats sector counters (field 6 = sectors read,
  # field 10 = sectors written; a sector is 512 B). The awk skips loop/ram/dm
  # devices and idle disks, and pre-multiplies to a monotonic BYTE tally so the
  # `counter` derivation publishes a byte/s RATE (same mechanism as host.net).
  host.diskio:
    cmd: |-
      awk '$3 !~ /^(loop|ram|dm-)/ && ($6+$10)>0 {printf "%s\t%d\t%d\n",$3,$6*512,$10*512}' /proc/diskstats
    interval: 2000
    extract:
      mode: columns
      delimiter: tab
      row_key: dev
      fields: { dev: 0, read: 1, write: 2 }
    schema:
      row_key: dev
      columns: { read: { type: counter }, write: { type: counter } }

# --- Panels --------------------------------------------------------------------
panels:
  actions:
    type: actions
    title: Host
  cpu:
    type: stats
    title: CPU
    topic: host.cpu
    row: _                 # single-stream topic → pin the one row (no select_from)
  mem:
    type: stats
    title: Memory
    topic: host.mem
    row: _
  load:
    type: stats
    title: Load (1m)
    topic: host.load
    row: _
    metrics: [load]        # `load` is type:number (metadata-ambiguous, not auto-
                           # graphed) — list it explicitly to graph the trend
  # The process TABLE — lists host.proc's rows, sorted by CPU, selectable.
  procs:
    type: table
    title: Processes
    topic: host.proc
    columns: [cpu, mem, comm]   # schema columns to show; pid is the row identity
    sort: cpu                    # default sort (desc for a metric)
  # The same host.proc topic as a btop-style CPU BAR CHART — one bar per process,
  # ordered by CPU and filled proportionally. A `gauge` is the SNAPSHOT bar
  # sibling of the table (list) and the stats graph (history): it reads the same
  # `metrics:` topic, needs no code, and its rows are selectable too.
  cpubars:
    type: gauge
    title: CPU bars
    topic: host.proc
    column: cpu           # the metered value (its schema type `percent` → 0–100 bar)
    label: comm           # bar label from the command name (not the pid)
  # Drill-down: the CPU/MEM history of the process SELECTED in the table.
  procsel:
    type: stats
    title: Selected
    topic: host.proc
    select_from: procs
    metrics: [cpu, mem]
  # Network throughput TABLE — per-interface rx/tx rates (derived from the
  # counter fields; the table shows live B/s).
  net:
    type: table
    title: Network
    topic: host.net
    columns: [rx, tx]
    sort: rx
  # Network throughput GRAPH — total up/down over time (btop's net braille),
  # from the single-stream host.nettotal producer. A single stream → pin `row: _`
  # (like cpu/mem/load); rx and tx overlaid. (Not a select_from of the net table —
  # see host.nettotal's note.)
  netgraph:
    type: stats
    title: Network
    topic: host.nettotal
    row: _
    metrics: [rx, tx]
  # Disk USAGE — a btop-style gauge, one bar per mount, filled by used %. Same
  # `gauge` panel as the CPU bars; `pct` is the metered column, `mount` the label.
  disk:
    type: gauge
    title: Disk
    topic: host.disk
    column: pct
    label: mount
  # Disk THROUGHPUT TABLE — per-device read/write rates (host.diskio counters →
  # B/s), the disk sibling of the network table.
  diskio:
    type: table
    title: Disk I/O
    topic: host.diskio
    columns: [read, write]
    sort: write
  # The Output pane. Its Info tab is the process DETAIL CARD: focus the process
  # table (or CPU bars) and it shows the selected process's full column set —
  # state, threads, RSS, parent pid, user, command line. Host-action output
  # (ps/uptime) lands in its Transcript tab.
  detail:
    type: detail
    title: Output

layout:
  # Three concern-grouped columns (btop-style). Panels are placed DIRECTLY (not
  # tabbed): a multi-tab slot only renders its strip for content panes, so metrics
  # panels — table/gauge/stats — each own their column slot. `actions` must sit in
  # the LAST column (framework rule), which soft-caps at 3 panes.
  #
  # `select_from` resolves the SPECIFIC named pane (B-F3), so table mint order no
  # longer matters — a follower graph tracks the pane it names regardless of which
  # table is the kind-primary. The net trend graph stays single-stream on the
  # host.nettotal aggregate by choice, not necessity.
  columns:
    # System dashboard — all the trend graphs + the disk-usage gauge (no table).
    - width: 30
      panels:
        - cpu
        - mem
        - load
        - disk                          # disk USAGE gauge (df → used% per mount)
        - netgraph                      # total network throughput graph (host.nettotal)
    # The data tables — CPU bars, the process table (FIRST table = select_from
    # primary), then network + disk-I/O throughput tables.
    - width: 44
      panels:
        - cpubars                       # btop-style CPU bar chart (gauge)
        - procs                         # process table (host.proc) — procsel's select_from target
        - net                           # network throughput table (counter → B/s)
        - diskio                        # disk THROUGHPUT table (counter → B/s)
    # Selected-process drill-down, host actions, and the Output pane (whose Info
    # tab is the process detail card).
    - panels:
        - procsel                       # CPU/MEM history of the selected process
        - actions
        - { tabs: [detail], height: 40% }

# --- Host actions --------------------------------------------------------------
groups:
  host:
    label: Host
    containers: []
    actions:
      top:
        label: top (live)
        desc: Live process view in an embedded terminal tab. Quit with `q`.
        type: spawn
        cmd: top
      ps:
        label: processes (snapshot)
        desc: Top 25 processes by CPU, one-shot into the Output panel.
        type: run
        cmd: ps -eo pid,pcpu,pmem,comm --sort=-pcpu | head -25
      uptime:
        label: uptime
        desc: System uptime + load averages.
        type: run
        cmd: uptime
